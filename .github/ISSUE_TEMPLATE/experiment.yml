name: SNU GOM 실험 기록
description: CPU·시뮬레이션·하드웨어 결과와 실패 사례
title: "[Experiment] "
body:
  - type: dropdown
    id: scope
    attributes:
      label: 검증 범위
      options: [CPU 검사, 도형 또는 import, 물리 시뮬레이션, 정책 학습, 실물 시험]
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: 버전과 재현 방법
      description: commit, robot revision, CAD version, 환경, 명령, seed를 포함하세요.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 반복 횟수와 결과
      description: 성공 기준, 실패 횟수, 원본 로그, 전류·온도 등을 기록하세요.
    validations:
      required: true
