name: SNU GOM task / 개발 작업
description: Team task with ownership and acceptance criteria / 담당 영역과 완료 조건
title: '[Task] '
body:
- type: dropdown
  id: area
  attributes:
    label: Area / 담당 영역
    options:
    - M1 Mechanical / 기구
    - M2 Electronics / 전장
    - M3 Firmware / 펌웨어
    - M4 Simulation / 시뮬레이션
    - M5 Integration / 통합
  validations:
    required: true
- type: input
  id: people
  attributes:
    label: Owner and reviewer / 담당자와 검토자
    placeholder: GitHub usernames or unassigned / 실제 계정 또는 미배정
  validations:
    required: true
- type: textarea
  id: outcome
  attributes:
    label: Goal and acceptance criteria / 목표와 완료 조건
    description: Include commands or CAD, circuit and measurement evidence. / 실행 명령
      또는 CAD·회로·측정 증거를 명시하세요.
  validations:
    required: true
- type: textarea
  id: dependencies
  attributes:
    label: Dependencies and interface changes / 의존 작업과 인터페이스 변경
    description: Link issues and joint, frame, power or communication impacts. / 관련
      Issue와 관절·좌표·전원·통신 영향을 기록하세요.
- type: input
  id: revision
  attributes:
    label: Robot revision or CAD named version / 로봇·CAD 버전
