name: SNU GOM 개발 작업
description: 담당 영역과 완료 조건이 있는 팀 작업
title: "[Task] "
body:
  - type: dropdown
    id: area
    attributes:
      label: 담당 영역
      options: [M1 기구, M2 전장, M3 펌웨어, M4 시뮬레이션, M5 통합]
    validations:
      required: true
  - type: input
    id: people
    attributes:
      label: 담당자와 검토자
      placeholder: 실제 GitHub 계정 또는 미배정
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 목표와 완료 조건
      description: 실행 명령 또는 CAD·회로·측정 증거를 명시하세요.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 의존 작업과 인터페이스 변경
      description: 관련 Issue와 관절·좌표·전원·통신 영향을 기록하세요.
  - type: input
    id: revision
    attributes:
      label: 로봇 버전 또는 CAD named version
