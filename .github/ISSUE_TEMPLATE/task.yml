name: SNU GOM task / 개발 작업
description: Project task and expected result / 프로젝트 작업과 기대 결과
title: '[Task] '
body:
- type: dropdown
  id: area
  attributes:
    label: Topic / 주제
    options:
    - Mechanical / 기구
    - Electronics / 전장
    - Firmware / 펌웨어
    - Simulation / 시뮬레이션
    - Integration / 통합
  validations:
    required: true
- type: textarea
  id: outcome
  attributes:
    label: Goal and acceptance criteria / 목표와 완료 조건
    description: Include commands or CAD, circuit and measurement evidence. / 실행 명령
      또는 CAD·회로·측정 증거를 명시하세요.
  validations:
    required: true
- type: textarea
  id: dependencies
  attributes:
    label: Dependencies and interface changes / 의존 작업과 인터페이스 변경
    description: Link issues and joint, frame, power or communication impacts. / 관련
      Issue와 관절·좌표·전원·통신 영향을 기록하세요.
- type: input
  id: revision
  attributes:
    label: Robot revision or CAD named version / 로봇·CAD 버전
