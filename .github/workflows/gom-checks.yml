name: SNU GOM checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gom-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python tools/check_project.py
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q tools tests
  gom-viewer-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-gom-viewer.txt
      - run: python tools/view_robot.py --mode sweep --headless --seconds 2
