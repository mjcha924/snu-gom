name: URDF motion pipeline CPU checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  motion-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-motion-pipeline.txt
      - run: python -m pip install torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover -s tests/motion_pipeline -v
      - run: python -m unittest discover -s tests/walking -v
      - run: python -m compileall -q snu_gom_walk scripts
